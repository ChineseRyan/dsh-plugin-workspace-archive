name: ✨ 功能建议
description: 提出一个新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 描述使用中的痛点，而不是直接给出方案——这样更容易找到对症的改法。
      placeholder: 我有十几个工作区，逐个归档太慢了……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你设想的做法
      description: 可选。如果已有明确想法，写在这里。
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 你试过的替代方案
      description: 可选。目前你是怎么绕过这个问题的？
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue，没有重复
          required: true
